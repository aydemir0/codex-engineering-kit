name: CI

on:
  push:
    branches: [main, feat/initial-architecture, feat/codex-native-plugin-v0.2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  content-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate repository contracts
        run: python tests/validate_content.py
      - name: Validate native plugin contract
        run: python -m unittest tests.test_plugin_contract -v
      - name: Validate plugin acceptance helpers
        run: python -m unittest tests.test_plugin_smoke -v
      - name: Validate native hook packaging contract
        run: python -m unittest tests.test_hook_contract -v
      - name: Validate native hook behavior contracts
        run: python -m unittest tests.test_hook_dispatch -v
      - name: Validate native reviewer agent contract
        run: python -m unittest tests.test_agent_contract -v
      - name: Validate process runner contract
        run: python -m unittest tests.test_process_runner -v
      - name: Validate package manager contract
        run: python -m unittest tests.test_package_manager -v
      - name: Validate verification engine contract
        run: python -m unittest tests.test_verification_engine -v
      - name: Validate deterministic eval grader contract
        run: python -m unittest tests.test_eval_runner -v
      - name: Validate authenticated pressure helper contract
        run: python -m unittest tests.test_codex_pressure -v

  powershell-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Windows plugin acceptance helper regression
        shell: pwsh
        run: python -m unittest tests.test_plugin_smoke -v
      - name: Windows native hook packaging contract
        shell: pwsh
        run: python -m unittest tests.test_hook_contract -v
      - name: Windows native hook behavior contracts
        shell: pwsh
        run: python -m unittest tests.test_hook_dispatch -v
      - name: Windows native reviewer agent contract
        shell: pwsh
        run: python -m unittest tests.test_agent_contract -v
      - name: Windows process runner contract
        shell: pwsh
        run: python -m unittest tests.test_process_runner -v
      - name: Windows package manager contract
        shell: pwsh
        run: python -m unittest tests.test_package_manager -v
      - name: Windows verification engine contract
        shell: pwsh
        run: python -m unittest tests.test_verification_engine -v
      - name: Windows deterministic eval grader contract
        shell: pwsh
        run: python -m unittest tests.test_eval_runner -v
      - name: Windows authenticated pressure helper contract
        shell: pwsh
        run: python -m unittest tests.test_codex_pressure -v
      - name: Installer lifecycle
        shell: pwsh
        run: ./tests/Test-Install.ps1
      - name: Verification runner
        shell: pwsh
        run: ./tests/Test-Verify.ps1
      - name: Learning safety
        shell: pwsh
        run: ./tests/Test-Learning.ps1
      - name: MCP configuration
        shell: pwsh
        run: ./tests/Test-Mcp.ps1
